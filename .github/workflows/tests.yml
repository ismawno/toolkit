# Builds toolkit on every supported toolchain and runs the toolkit-tests suite (Catch2, through ctest) on each of them.
#
# Every test case runs in a process of its own (catch_discover_tests), with a timeout: toolkit is built without
# exceptions, so a failed REQUIRE aborts its process, and on Windows debug builds abort() would otherwise wait forever
# on the CRT's message box.

name: Tests

on:
  push:
    branches: [main, workflow/testing]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolkit:
    name: ${{ matrix.config.name }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        config:
          - { name: linux-gcc, os: ubuntu-26.04, cc: gcc, cxx: g++ }
          - {
              name: linux-clang,
              os: ubuntu-26.04,
              cc: clang,
              cxx: clang++,
              lld: true,
            }
          - { name: windows-msvc, os: windows-2025-vs2026, cc: cl, cxx: cl }
          # the GNU style clang++ driver, not clang-cl: toolkit picks its flags by compiler id and by MSVC, and
          # clang-cl would get both kinds. lld links LTO (release) objects, which link.exe cannot read
          - {
              name: windows-clang,
              os: windows-2025-vs2026,
              cc: clang,
              cxx: clang++,
              lld: true,
            }
          - { name: macos-clang, os: macos-26, cc: clang, cxx: clang++ }

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------------------------------------------------------
      #  Toolchains and dependencies
      # ---------------------------------------------------------------------------------------------------------------

      # the reflection and serialization code generators run Python 3 at build time. CMake finds it on its own, but
      # runner images ship several interpreters: this pins the same one on every job
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build lld

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }

      # Ninja does not set up the MSVC environment the way the Visual Studio generator does. clang needs it too, for
      # the Windows SDK and the MSVC runtime
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ---------------------------------------------------------------------------------------------------------------
      #  Build
      # ---------------------------------------------------------------------------------------------------------------

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.config.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }}
          ${{ matrix.config.lld && '-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld' || '' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # ---------------------------------------------------------------------------------------------------------------
      #  Tests. ctest writes a JUnit report, uploaded below for every configuration
      # ---------------------------------------------------------------------------------------------------------------

      - name: Tests
        run: >
          ctest --preset ${{ matrix.preset }} --timeout 300
          --output-junit ${{ github.workspace }}/build/${{ matrix.preset }}/toolkit-tests.xml

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolkit-tests-${{ matrix.config.name }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/toolkit-tests.xml
          if-no-files-found: ignore

  # a single check to require in branch protection (Settings > Branches): it is green only when every configuration is
  tests-ok:
    name: Tests ok
    if: always()
    needs: toolkit
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.toolkit.result }}" = "success"
